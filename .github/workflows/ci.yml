name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job installs and runs third-party dependency code, so the default GITHUB_TOKEN is
# read-only and never persisted to .git/config. Jobs opt into extra scopes individually.
permissions:
  contents: read

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --coverage --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - run: pnpm build
        if: always()
      - uses: ./
        if: always()
        with:
          api-key: ${{ secrets.TESTGLANCE_API_KEY }}
          report-path: test-results/vitest.xml
          github-token: ${{ github.token }}
          annotate-failures: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Split in two so the App token never shares a job with dependency code: install/build can
  # leave behind processes, git config (core.fsmonitor, filters) or .gitattributes edits that
  # would read the token once it is in .git/config. Only the built dist/ crosses over.
  build-release:
    name: Release (build dist)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-format, typecheck, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      # No `cache: pnpm`: the store cache is written by the PR/test jobs, and restoring it here
      # would let lower-privilege jobs choose the bytes that get bundled into v1.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: rm -rf dist
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release-v1:
    name: Release (commit dist, retag v1)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-release]
    runs-on: ubuntu-latest
    # The App token does the pushing; GITHUB_TOKEN only reads. No dependency install here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rm -rf dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.REBUILD_BOT_APP_ID }}
          private-key: ${{ secrets.REBUILD_BOT_PRIVATE_KEY }}
      # core.hooksPath=/dev/null: never run repo hooks (husky) while the token is in the remote URL.
      - name: Commit dist/ if changed
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "testglance-rebuild-bot[bot]"
          git config user.email "282057382+testglance-rebuild-bot[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A -f dist/
          if git diff --cached --quiet; then
            echo "dist/ unchanged — nothing to commit."
          else
            git -c core.hooksPath=/dev/null commit -m "chore: rebuild dist [skip ci]"
            git -c core.hooksPath=/dev/null push origin HEAD:main
          fi
      - name: Force-retag v1 to HEAD
        run: |
          git tag -f v1
          git -c core.hooksPath=/dev/null push origin v1 --force
